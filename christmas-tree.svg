<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 125" width="100" height="125">
<style>
.tree{transform-origin:50px 110px;animation:sway 4s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
.star{transform-origin:50px 14px;animation:glow 1.6s ease-in-out infinite}
@keyframes glow{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.25);opacity:.75}}
.l{animation:blink 1.5s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.snow{animation:fall 6s linear infinite;fill:#fff;opacity:.8}
@keyframes fall{0%{transform:translateY(-10px);opacity:0}10%{opacity:.8}100%{transform:translateY(125px);opacity:0}}
</style>
<circle class="snow" cx="12" cy="0" r="1.5"/><circle class="snow" cx="88" cy="0" r="1.2" style="animation-delay:2s"/><circle class="snow" cx="22" cy="0" r="1" style="animation-delay:4s"/><circle class="snow" cx="80" cy="0" r="1.6" style="animation-delay:3s"/>
<g class="tree">
<rect x="44" y="104" width="12" height="14" rx="2" fill="#7a4a2a"/>
<polygon points="50,62 16,108 84,108" fill="#1f8a4c"/>
<polygon points="50,40 22,84 78,84" fill="#26a65b"/>
<polygon points="50,18 30,60 70,60" fill="#2ecc71"/>
<path d="M30 60 Q50 70 70 60" stroke="#ffd23f" stroke-width="1.5" fill="none" opacity=".7"/>
<path d="M22 84 Q50 96 78 84" stroke="#ffd23f" stroke-width="1.5" fill="none" opacity=".7"/>
<circle class="l" cx="50" cy="38" r="3.2" fill="#ff4d4d" style="animation-delay:0s"/><circle class="l" cx="42" cy="52" r="3.2" fill="#ffd23f" style="animation-delay:0.3s"/><circle class="l" cx="58" cy="50" r="3.2" fill="#4dc3ff" style="animation-delay:0.6s"/><circle class="l" cx="36" cy="70" r="3.2" fill="#ff4d4d" style="animation-delay:0.9s"/><circle class="l" cx="50" cy="66" r="3.2" fill="#ffd23f" style="animation-delay:1.2s"/><circle class="l" cx="64" cy="72" r="3.2" fill="#4dc3ff" style="animation-delay:0.45s"/><circle class="l" cx="30" cy="92" r="3.2" fill="#ffd23f" style="animation-delay:0.75s"/><circle class="l" cx="44" cy="88" r="3.2" fill="#4dc3ff" style="animation-delay:1.05s"/><circle class="l" cx="58" cy="90" r="3.2" fill="#ff4d4d" style="animation-delay:0.15s"/><circle class="l" cx="71" cy="94" r="3.2" fill="#ffd23f" style="animation-delay:1.35s"/>
</g>
<polygon class="star" points="50,4 53,11 61,11 55,16 57,24 50,19 43,24 45,16 39,11 47,11" fill="#ffd23f"/>
</svg>
